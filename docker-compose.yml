services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bikeservice
      POSTGRES_USER: bikeservice
      POSTGRES_PASSWORD: bikeservice_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bikeservice -d bikeservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5100:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Database=bikeservice;Username=bikeservice;Password=bikeservice_secret"
      Jwt__Key: "SuperTajnyKluczDoJWT_MinimumTrzydziesciDwaZnaki!"
      Jwt__Issuer: BikeService
      Jwt__Audience: BikeService
      Jwt__ExpiresInHours: "2"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./BikeService.Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
